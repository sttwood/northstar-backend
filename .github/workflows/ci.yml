name: Backend CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true
      - run: go mod download
      - name: Start native PostgreSQL for integration tests
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          sudo systemctl start postgresql
          sudo -u postgres psql -c "CREATE USER northstar_ci WITH PASSWORD 'local-ci-test-password';"
          sudo -u postgres createdb -O northstar_ci northstar_ci
      - run: go test ./...
        env:
          TEST_DATABASE_URL: postgres://northstar_ci:local-ci-test-password@localhost:5432/northstar_ci?sslmode=disable
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
        env:
          GOTOOLCHAIN: go1.27.2
      - run: go build -trimpath -o bin/northstar ./cmd/server
      - uses: actions/upload-artifact@v4
        with:
          name: northstar-linux-amd64
          path: bin/northstar
