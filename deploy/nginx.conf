# Include inside nginx's http context. Replace the hostname and configure TLS
# certificates plus HTTP-to-HTTPS redirection before releasing publicly.
map $http_upgrade $northstar_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name intranet.example.com;
    client_max_body_size 11m;

    # Go owns /api and health checks; other requests proxy to Next.js using
    # FRONTEND_UPSTREAM_URL=http://127.0.0.1:3000 in backend.env.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $northstar_connection_upgrade;
        proxy_read_timeout 90s;
        proxy_buffering off;
    }
}
